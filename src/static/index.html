<html>

<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="/index.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Mina">
  <script src="https://kit.fontawesome.com/5a3539eb0b.js" crossorigin="anonymous"></script>
  <script src="/app.js"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, shrink-to-fit=no" />
  <title>SavedBy Mock Store</title>
</head>

<body>
  <header>
    <h1>SavedBy Store</h1>
    <i class="fa-solid fa-cart-shopping"></i>
  </header>

  <main>
    <input type="text" id="search-input" placeholder="Search products..." oninput="searchInput()" />
    <input type="checkbox" id="sort-checkbox" onchange="sortProducts()" />
    <label for="sort-checkbox">Sort by price (high to low)</label>
    <h2>Products</h2>
    <div id="product-container">
      <!-- Products will be rendered here -->
    </div>
  </main>
</body>

</html>
